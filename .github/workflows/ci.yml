name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: The binary runs and reports on the runner itself
        run: |
          ./.build/release/claude-top --version
          ./.build/release/claude-top --json > /tmp/snapshot.json
          python3 -c "import json; d=json.load(open('/tmp/snapshot.json')); \
            assert d['version'] >= 1; assert d['machine']['cpuCount'] > 0; \
            print(f\"attributed {len(d['groups'])} groups\")"

  # Fixtures are captured from a real machine. This is the backstop for the
  # capture and anonymize scripts: if an identifying detail ever reaches a
  # commit, fail the build rather than publish it.
  fixture-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan fixtures for secrets and personal paths
        run: |
          set -euo pipefail
          if grep -rqE '(^|[^A-Za-z0-9-])(sk-[A-Za-z0-9]{16}|ghp_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16})|BEGIN [A-Z ]*PRIVATE KEY' Tests/Fixtures/; then
            echo "secret-shaped content in fixtures"; exit 1
          fi
          if grep -rqP '/Users/(?!USER)[A-Za-z0-9_.-]+' Tests/Fixtures/; then
            echo "un-rewritten home directory in fixtures"; exit 1
          fi
          if [ -f Scripts/anonymize-map.json ]; then
            echo "anonymize-map.json is committed; it is the reverse lookup and must stay untracked"; exit 1
          fi
          # The opening prompt is the user's own words. Capture strips it, and the engine
          # carries it no further than the terminal, so a fixture holding one means both
          # of those failed.
          # Only agents.json, because that is where the session prompt would be. Container
          # names and captured command lines contain the word legitimately.
          if grep -lq '"name"' Tests/Fixtures/*/agents.json 2>/dev/null; then
            echo "a fixture's agents.json contains a name, which is the user's opening prompt"
            exit 1
          fi
          echo "fixtures clean"
